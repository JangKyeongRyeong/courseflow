
services:
  mysql:
    image: mysql:8.4
    container_name: courseflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: courseflow
      MYSQL_USER: courseflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?iHaveAGun0729}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?iHaveAGun0729}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - courseflow-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  courseflow-mysql-data:

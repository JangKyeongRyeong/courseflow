spring.application.name=courseflow
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/courseflow?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:courseflow}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none

management.endpoints.web.exposure.include=health,info,metrics
courseflow.web.origin=${COURSEFLOW_WEB_ORIGIN:http://localhost:5173}